<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IA Transformer Local (~100MB) + Memória Evolutiva</title>
<style>
  body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; height: 95vh; }
  h2 { margin: 0 0 8px 0; color: #00e676; }
  #status-box { width: 100%; max-width: 650px; background: #1e1e1e; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #333; font-size: 13px; }
  #bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  #bar-fill { width: 0%; height: 100%; background: #00e676; transition: width 0.2s; }
  #chat { width: 100%; max-width: 650px; flex: 1; background: #181818; border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; }
  .msg { padding: 10px 14px; border-radius: 8px; max-width: 82%; line-height: 1.4; word-wrap: break-word; }
  .user { background: #2962ff; color: white; align-self: flex-end; }
  .ai { background: #262626; color: #e0e0e0; align-self: flex-start; border-left: 3px solid #00e676; }
  .sys { background: #2b2600; color: #ffd54f; align-self: center; font-size: 12px; text-align: center; }
  #controls { width: 100%; max-width: 650px; display: flex; gap: 8px; margin-top: 10px; }
  input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 15px; outline: none; }
  button { padding: 12px 18px; border: none; border-radius: 6px; background: #00e676; color: #000; font-weight: bold; cursor: pointer; }
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
</style>
</head>
<body>

  <h2>IA Neural Local (Transformers.js)</h2>
  <div id="status-box">
    <div id="status-text">Iniciando motor neural no navegador...</div>
    <div id="bar-bg"><div id="bar-fill"></div></div>
  </div>

  <div id="chat">
    <div class="msg sys">Aguarde o download único do modelo (~100 MB) para o cache do navegador. Depois disso, ela pensará sozinha aqui dentro!</div>
  </div>

  <div id="controls">
    <input type="text" id="input" placeholder="Aguardando cérebro carregar..." disabled autocomplete="off">
    <button id="btn-enviar" disabled>Enviar</button>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://jsdelivr.net';

    // Permite baixar o modelo do HuggingFace e salvar no cache local do navegador
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const statusText = document.getElementById('status-text');
    const barFill = document.getElementById('bar-fill');
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btnEnviar = document.getElementById('btn-enviar');

    let gerador = null;
    // Memória persistente onde ficam os aprendizados que você passa para ela
    let memoriaAprendida = JSON.parse(localStorage.getItem('ia_transformer_memoria')) || [];

    function addMsg(texto, tipo) {
      const div = document.createElement('div');
      div.className = `msg ${tipo}`;
      div.innerText = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Carrega um modelo Transformer real e super leve (~135M parâmetros quantizado)
    async function carregarIA() {
      try {
        gerador = await pipeline('text-generation', 'HuggingFaceTB/SmolLM2-135M-Instruct', {
          dtype: 'q4', // Compressão leve para rodar bem em notebook básico
          progress_callback: (info) => {
            if (info.status === 'progress') {
              const pct = Math.round(info.progress || 0);
              statusText.innerText = `Baixando cérebro neural (${info.file}): ${pct}%`;
              barFill.style.width = `${pct}%`;
            } else if (info.status === 'ready') {
              statusText.innerText = 'Cérebro carregado na memória! Pronto para conversar e aprender.';
              barFill.style.width = '100%';
            }
          }
        });

        input.disabled = false;
        btnEnviar.disabled = false;
        input.placeholder = "Converse ou ensine algo novo...";
        addMsg("Pronto! Já estou ativa no seu navegador. Tudo que conversarmos vai moldar minhas próximas respostas.", "sys");
      } catch (erro) {
        statusText.innerText = "Erro ao carregar modelo: " + erro.message;
        console.error(erro);
      }
    }

    // Função de pensamento usando a rede neural Transformer + sua memória evolutiva
    async function responder() {
      const textoUsuario = input.value.trim();
      if (!textoUsuario || !gerador) return;

      input.value = '';
      input.disabled = true;
      btnEnviar.disabled = true;
      addMsg(textoUsuario, 'user');

      // Guarda a interação na memória evolutiva (mantém os últimos 15 aprendizados mais relevantes)
      memoriaAprendida.push(`Humano: ${textoUsuario}`);
      if (memoriaAprendida.length > 20) memoriaAprendida.shift();
      localStorage.setItem('ia_transformer_memoria', JSON.stringify(memoriaAprendida));

      // Monta o prompt injetando o que ela já aprendeu com você
      const contextoHistorico = memoriaAprendida.slice(-8).join("\n");
      const mensagens = [
        { 
          role: "system", 
          content: "Você é uma inteligência artificial jovem em fase de aprendizado. Responda sempre em português, de forma curta, curiosa e natural, aprendendo com o que o usuário diz." 
        },
        { 
          role: "user", 
          content: `Histórico recente do que aprendi:\n${contextoHistorico}\n\nResponda agora à última mensagem em português:` 
        }
      ];

      try {
        const saida = await gerador(mensagens, {
          max_new_tokens: 60,
          temperature: 0.8,      // Controla a criatividade (0.8 deixa ela mais espontânea)
          do_sample: true,
          repetition_penalty: 1.2
        });

        // Extrai apenas a resposta nova gerada pela rede neural
        const respostaCompleta = saida[0].generated_text;
        const respostaIA = respostaCompleta[respostaCompleta.length - 1].content.trim();

        addMsg(respostaIA || "...", 'ai');

        // Salva a própria resposta na memória para ela lembrar o que falou
        memoriaAprendida.push(`IA: ${respostaIA}`);
        localStorage.setItem('ia_transformer_memoria', JSON.stringify(memoriaAprendida));
      } catch (e) {
        addMsg("Buguei ao processar essa frase: " + e.message, 'sys');
      }

      input.disabled = false;
      btnEnviar.disabled = false;
      input.focus();
    }

    btnEnviar.addEventListener('click', responder);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') responder(); });

    carregarIA();
  </script>
</body>
</html>
