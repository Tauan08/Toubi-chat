<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Rápido • Qwen2.5-0.5B</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f6f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .chat-container {
            width: 100%;
            max-width: 760px;
            height: 90vh;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 18px 20px;
            border-bottom: 1px solid #eef1f4;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header h1 { font-size: 1.1rem; font-weight: 600; color: #1a1a1a; }
        .status {
            font-size: 0.78rem;
            color: #888;
            background: #f0f2f5;
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: auto;
            white-space: nowrap;
        }
        #chatOutput {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #f0f2f5;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
        }
        .message.bot.streaming::after {
            content: "▍";
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .input-area {
            display: flex;
            padding: 14px 16px;
            border-top: 1px solid #eef1f4;
            gap: 10px;
        }
        #userInput {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }
        #userInput:focus { border-color: #2563eb; }
        #sendBtn {
            padding: 0 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }
        #sendBtn:disabled { background: #a0b4e3; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chat Rápido</h1>
            <span class="status" id="status">Iniciando…</span>
        </div>
        <div id="chatOutput"></div>
        <div class="input-area">
            <input id="userInput" placeholder="Aguarde o modelo aquecer…" disabled />
            <button id="sendBtn" disabled>Enviar</button>
        </div>
    </div>

    <script type="module">
        import { pipeline, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4';

        const MODEL_ID = 'onnx-community/Qwen2.5-0.5B-Instruct';
        const MAX_NEW_TOKENS = 60;      // Respostas curtas e rápidas
        const MAX_HISTORY = 7;          // System + últimas 6 mensagens

        const chatOutput = document.getElementById('chatOutput');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        let generator = null;
        let isGenerating = false;

        const messages = [
            {
                role: 'system',
                content: 'Você é um assistente útil e responde em português de forma clara, curta e direta.'
            }
        ];

        async function detectDevice() {
            if (!navigator.gpu) return 'wasm';
            try {
                const adapter = await navigator.gpu.requestAdapter();
                return adapter ? 'webgpu' : 'wasm';
            } catch {
                return 'wasm';
            }
        }

        // Warm-up: compila os shaders com um prompt curto e descarta o resultado
        async function warmUp() {
            statusEl.textContent = 'Aquecendo modelo (compilando shaders)…';
            try {
                await generator('Oi', {
                    max_new_tokens: 2,
                    do_sample: false,
                    streamer: undefined
                });
            } catch (e) {
                console.warn('Warm-up falhou, mas o modelo pode funcionar:', e);
            }
        }

        async function loadModel() {
            const device = await detectDevice();
            console.log('Device escolhido:', device);
            statusEl.textContent = `Carregando modelo (${device})…`;

            try {
                generator = await pipeline('text-generation', MODEL_ID, {
                    device,
                    dtype: 'q4',
                    progress_callback: (p) => {
                        if (p.status === 'progress' && p.file) {
                            statusEl.textContent =
                                `Baixando ${p.file} (${Math.round(p.progress || 0)}%)`;
                        }
                    }
                });
            } catch (err) {
                console.error('Falha ao carregar modelo:', err);
                statusEl.textContent = 'Erro ao carregar modelo — veja o console';
                return;
            }

            // Compila os shaders ANTES de liberar o input
            await warmUp();

            statusEl.textContent = `Pronto (${device === 'webgpu' ? 'WebGPU' : 'CPU'})`;
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(text, sender, streaming = false) {
            const div = document.createElement('div');
            div.className = `message ${sender}` + (streaming ? ' streaming' : '');
            div.textContent = text;
            chatOutput.appendChild(div);
            chatOutput.scrollTop = chatOutput.scrollHeight;
            return div;
        }

        function formatPrompt() {
            return messages.map(m => {
                if (m.role === 'system')    return `<|im_start|>system\n${m.content}<|im_end|>`;
                if (m.role === 'user')      return `<|im_start|>user\n${m.content}<|im_end|>`;
                if (m.role === 'assistant') return `<|im_start|>assistant\n${m.content}<|im_end|>`;
                return '';
            }).join('\n') + '\n<|im_start|>assistant\n';
        }

        function trimHistory() {
            if (messages.length > MAX_HISTORY) {
                // Mantém o system (índice 0) e remove as mensagens mais antigas
                messages.splice(1, messages.length - MAX_HISTORY);
            }
        }

        async function generateResponse() {
            const userText = userInput.value.trim();
            if (!userText || isGenerating || !generator) return;

            isGenerating = true;
            sendBtn.disabled = true;
            userInput.disabled = true;
            userInput.value = '';

            addMessage(userText, 'user');
            messages.push({ role: 'user', content: userText });
            trimHistory();

            const botBubble = addMessage('', 'bot', true);
            const prompt = formatPrompt();
            let fullText = '';

            const streamer = new TextStreamer(generator.tokenizer, {
                skip_prompt: true,
                skip_special_tokens: true,
                callback_function: (token) => {
                    fullText += token;
                    botBubble.textContent = fullText.replace(/<\|.*?\|>/g, '');
                    chatOutput.scrollTop = chatOutput.scrollHeight;
                }
            });

            try {
                await generator(prompt, {
                    max_new_tokens: MAX_NEW_TOKENS,
                    temperature: 0.6,
                    top_k: 40,
                    top_p: 0.9,
                    do_sample: true,
                    repetition_penalty: 1.1,
                    streamer
                });
            } catch (err) {
                console.error(err);
                botBubble.textContent = 'Desculpe, ocorreu um erro ao gerar a resposta.';
            } finally {
                botBubble.classList.remove('streaming');
                const assistantReply = fullText.replace(/<\|.*?\|>/g, '').trim();
                if (assistantReply) {
                    messages.push({ role: 'assistant', content: assistantReply });
                }
                isGenerating = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', generateResponse);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateResponse();
            }
        });

        loadModel();
    </script>
</body>
</html>
