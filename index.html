<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toubi</title>
<style>
:root{--bg:#0f1115;--bg2:#171a21;--bg3:#20242e;--border:#2a2f3a;--txt:#e8eaed;--muted:#9aa0aa;--accent:#10a37f;--danger:#e05555}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:264px;flex:0 0 264px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px;gap:8px}
.brand{font-weight:800;font-size:20px;padding:8px 6px;letter-spacing:.5px}
.brand span{color:var(--accent)}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
.newchat{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--txt);cursor:pointer}
.newchat:hover{background:var(--bg3)}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.chat-list::-webkit-scrollbar{width:8px}
.chat-list::-webkit-scrollbar-thumb{background:#2f3542;border-radius:8px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;user-select:none}
.chat-item:hover{background:var(--bg3);color:var(--txt)}
.chat-item.active{background:var(--bg3);color:var(--txt)}
.chat-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .acts{display:none;gap:2px}
.chat-item:hover .acts,.chat-item.active .acts{display:flex}
.mini{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:5px;line-height:1}
.mini:hover{background:#333a47;color:#fff}
.side-foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:8px}
.side-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;text-align:left}
.side-btn:hover{background:var(--bg3);color:var(--txt)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.pill{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--accent);border-color:var(--accent)}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--txt);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--bg3)}
.icon-btn.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#toggleSidebar{display:none}
.messages{flex:1;overflow-y:auto;padding:22px 16px 8px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:10px}
.messages::-webkit-scrollbar-thumb{background:#2f3542;border-radius:8px}
.msg{max-width:820px;margin:0 auto 20px;display:flex;gap:12px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.avatar{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:grid;place-items:center;font-size:12px;font-weight:800}
.msg.user .avatar{background:#3b4a5f;color:#dbe6f5}
.msg.assistant .avatar{background:var(--accent);color:#04201a}
.bubble{flex:1;min-width:0;line-height:1.65;overflow-wrap:anywhere}
.msg.user .bubble{color:#dfe6f0}
.bubble pre{background:#0b0d12;border:1px solid var(--border);padding:10px 12px;border-radius:8px;overflow:auto;margin:8px 0}
.bubble code{background:#0b0d12;padding:1px 5px;border-radius:4px;font-size:13px;font-family:ui-monospace,Consolas,monospace}
.bubble pre code{background:none;padding:0}
.bubble a{color:var(--accent)}
.typing{display:flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.welcome{max-width:760px;margin:8vh auto 0;text-align:center;color:var(--muted)}
.welcome h1{font-size:30px;color:var(--txt);margin:0 0 8px}
.welcome p{margin:0 0 18px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--bg2);border:1px solid var(--border);color:var(--txt);padding:9px 14px;border-radius:12px;cursor:pointer;font-size:13px}
.chip:hover{background:var(--bg3)}
.composer-wrap{padding:8px 16px 18px;flex:0 0 auto}
.composer{max-width:820px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:7px 7px 7px 14px}
.composer:focus-within{border-color:#3a4354}
.composer textarea{flex:1;background:none;border:none;color:var(--txt);resize:none;outline:none;font:inherit;line-height:1.5;max-height:180px;padding:9px 0}
.send{width:38px;height:38px;border-radius:11px;border:none;background:var(--accent);color:#04201a;font-weight:800;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.send:disabled{opacity:.4;cursor:not-allowed}
.hint{max-width:820px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:50}
.modal.hidden{display:none}
.modal-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px}
.modal-head .mini{margin-left:auto;font-size:18px}
.modal-body{padding:18px;overflow-y:auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=password],.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--txt);padding:10px 12px;font:inherit;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field small{display:block;color:var(--muted);font-size:11.5px;margin-top:5px;line-height:1.5}
.field textarea{resize:vertical;min-height:90px;line-height:1.5}
.field input[type=range]{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{background:var(--accent);color:#04201a;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--txt);font-weight:500}
.btn.ghost:hover{background:var(--bg3)}
.btn.danger{background:var(--danger);color:#fff}
.mem-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.mem-q{font-size:13px;color:var(--muted);margin-bottom:4px}
.mem-a{font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.mem-head{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.mem-head .mini{margin-left:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a3140;border:1px solid var(--border);color:var(--txt);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
@media (max-width:760px){
  #toggleSidebar{display:grid}
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.6)}
  .sidebar.open{transform:none}
  .messages{padding-top:14px}
  .welcome{margin-top:4vh}
  .welcome h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Toubi<span>.</span><small>aprendendo junto com você</small></div>
    <button class="newchat" id="newChat">＋ Novo chat</button>
    <div class="chat-list" id="chatList"></div>
    <div class="side-foot">
      <button class="side-btn" id="btnMemory">🧠 Memória (<span id="memCount">0</span>)</button>
      <button class="side-btn" id="btnSettings">⚙️ Configurações</button>
      <button class="side-btn" id="btnBackup">💾 Backup / Restaurar</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Menu">☰</button>
      <div class="title" id="chatTitle">Novo chat</div>
      <span class="pill" id="statusPill">local</span>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Fale com a Toubi… (Enter envia, Shift+Enter quebra linha)"></textarea>
        <button class="icon-btn" id="micBtn" title="Falar">🎤</button>
        <button class="send" id="sendBtn" title="Enviar">➤</button>
      </div>
      <div class="hint">Ensine assim: <code>aprenda: pergunta | resposta</code></div>
    </div>
  </main>
</div>
<div class="modal hidden" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">Título</h3>
      <button class="mini" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json" style="display:none">
<script>
(function(){
'use strict';

/* ================= UTILS ================= */
const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const now = () => Date.now();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, ms){
  ms = ms || 2200;
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, ms);
}

window.addEventListener('error', function(e){
  console.error('[Toubi] erro:', e.error || e.message);
  toast('Erro: ' + (e.message || 'algo falhou'));
});

function download(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
}

/* ================= TEXT ================= */
const STOP = new Set('a o e de da do das dos que em um uma para com nao sim se os as por no na ao mais como mas foi ser tem eu voce vc ele ela isso esse essa este esta me te lhe ja so ou the and is to of a an it my sua seu minhas meus pelo pela'.split(' '));

function normalize(s){
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function tokens(s){
  return normalize(s).split(' ').filter(function(w){ return w.length > 1 && !STOP.has(w); });
}

/* ================= STATE ================= */
const K = { chats:'toubi.chats.v1', mem:'toubi.mem.v1', cfg:'toubi.cfg.v1', active:'toubi.active.v1' };
function loadJSON(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Erro ao salvar: ' + e.message); } }

const DEFAULT_PERSONALITY =
'Você é a Toubi, uma IA pessoal criada pelo Tauan, rodando direto no navegador dele.\n' +
'Fale português do Brasil, de forma direta, calorosa e sem enrolação.\n' +
'Você é curiosa, gosta de aprender junto e admite quando não sabe.\n' +
'Quando não tiver certeza, diga o que sabe e o que falta.\n' +
'Você aprende com cada conversa e guarda o conhecimento de forma permanente.';

const state = {
  chats: loadJSON(K.chats, []),
  memory: loadJSON(K.mem, []),
  config: Object.assign({
    apiKey:'', baseUrl:'https://api.openai.com/v1', model:'gpt-4o-mini',
    threshold:0.42, personality: DEFAULT_PERSONALITY
  }, loadJSON(K.cfg, {})),
  activeId: loadJSON(K.active, null)
};

function persist(){
  saveJSON(K.chats, state.chats);
  saveJSON(K.mem, state.memory);
  saveJSON(K.cfg, state.config);
  saveJSON(K.active, state.activeId);
}

/* ================= MEMORY ================= */
function addMemory(q, a, source){
  q = String(q).trim(); a = String(a).trim();
  if (!q || !a) return null;
  const qn = normalize(q);
  const existing = state.memory.find(function(m){ return normalize(m.q) === qn; });
  if (existing){
    existing.a = a; existing.ts = now();
    existing.hits = (existing.hits || 0) + 1;
    persist(); updateMemCount();
    return existing;
  }
  const item = {id: uid(), q:q, a:a, ts: now(), hits:0, source: source || 'manual'};
  state.memory.push(item);
  if (state.memory.length > 5000) state.memory.shift();
  persist(); updateMemCount();
  return item;
}

function bumpHit(id){
  const m = state.memory.find(function(x){ return x.id === id; });
  if (m){ m.hits = (m.hits || 0) + 1; persist(); }
}

function scoreAgainst(qToks, qNorm, m){
  const mToks = tokens(m.q);
  if (!mToks.length) return 0;
  const setA = new Set(qToks), setB = new Set(mToks);
  let inter = 0;
  setA.forEach(function(t){ if (setB.has(t)) inter++; });
  let s = inter / Math.sqrt(setA.size * setB.size);
  let pref = 0;
  setA.forEach(function(t){
    if (t.length >= 4){
      let hit = false;
      setB.forEach(function(w){ if (!hit && w.indexOf(t) === 0) hit = true; });
      if (hit) pref++;
    }
  });
  s += 0.12 * (pref / setA.size);
  const mNorm = normalize(m.q);
  if (mNorm === qNorm) s = 1;
  else if (mNorm.length > 8 && (qNorm.indexOf(mNorm) > -1 || mNorm.indexOf(qNorm) > -1))
    s = Math.max(s, 0.85);
  s += Math.min(0.05, (m.hits || 0) * 0.004);
  return Math.min(s, 1);
}

function searchMemory(query){
  const qNorm = normalize(query);
  const qToks = tokens(query);
  if (!qToks.length) return null;
  let best = null;
  for (let i=0; i<state.memory.length; i++){
    const m = state.memory[i];
    const s = scoreAgainst(qToks, qNorm, m);
    if (!best || s > best.score) best = {score:s, id:m.id, q:m.q, a:m.a};
  }
  return (best && best.score >= 0.2) ? best : null;
}

function topMemories(query, k){
  k = k || 5;
  const qNorm = normalize(query);
  const qToks = tokens(query);
  if (!qToks.length) return [];
  return state.memory
    .map(function(m){ return {m:m, s: scoreAgainst(qToks, qNorm, m)}; })
    .filter(function(x){ return x.s >= 0.2; })
    .sort(function(a,b){ return b.s - a.s; })
    .slice(0, k)
    .map(function(x){ return x.m; });
}

function updateMemCount(){
  const el = $('#memCount');
  if (el) el.textContent = state.memory.length;
}

/* ================= SEEDS ================= */
function seedIfEmpty(){
  if (state.memory.length) return;
  const seeds = [
    ['oi', 'Oi! Eu sou a Toubi 👋 Ainda estou aprendendo, mas guardo tudo que você me ensina — mesmo sem internet.'],
    ['olá', 'Olá! Pode falar comigo normalmente. Se eu não souber algo, me ensina que eu guardo.'],
    ['bom dia', 'Bom dia! ☀️ Pronto pra aprender alguma coisa nova hoje?'],
    ['boa noite', 'Boa noite! 🌙 Tô aqui se precisar.'],
    ['quem é você', 'Eu sou a Toubi, sua IA local. Rodo no seu navegador, aprendo com você e guardo o conhecimento aqui no seu computador.'],
    ['tudo bem', 'Tudo certo por aqui! E com você?'],
    ['obrigado', 'De nada! 🙂'],
    ['obrigada', 'De nada! 🙂'],
    ['ajuda', 'Você pode:\n• Conversar comigo normalmente\n• Me ensinar: aprenda: pergunta | resposta\n• Usar o microfone 🎤 pra falar\n• Colocar uma API key em ⚙️ Configurações pra eu aprender mais rápido\n• Baixar tudo que aprendi em 💾 Backup']
  ];
  for (let i=0; i<seeds.length; i++) addMemory(seeds[i][0], seeds[i][1], 'seed');
}

/* ================= BUILTIN ================= */
function builtinAnswer(text){
  const t = normalize(text);
  if (/^(que horas|horas agora|hora agora|que hora)/.test(t))
    return 'Agora são ' + new Date().toLocaleTimeString('pt-BR') + '.';
  if (/^(que dia|data de hoje|hoje e que dia|qual a data)/.test(t))
    return 'Hoje é ' + new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'}) + '.';
  const raw = text.trim();
  if (/\d/.test(raw) && /^[\d\s+\-*/().,%^]+$/.test(raw)){
    try {
      const expr = raw.replace(/\^/g, '**').replace(/,/g, '.');
      if (/^[\d\s+\-*/().*]+$/.test(expr)){
        const val = Function('"use strict";return (' + expr + ')')();
        if (typeof val === 'number' && isFinite(val))
          return raw + ' = ' + Number(val.toFixed(10));
      }
    } catch(e){}
  }
  return null;
}

/* ================= TEACH ================= */
function parseTeach(text){
  const m = text.match(/^\s*(?:aprenda|aprender|ensine|ensina|lembre|memorize|guarde)\b[:\s]+([\s\S]+)$/i);
  if (!m) return null;
  const rest = m[1].trim();
  let parts = rest.split(/\s*(?:=>|\||->)\s*/);
  if (parts.length < 2){
    const i = rest.indexOf(' = ');
    if (i > -1) parts = [rest.slice(0, i), rest.slice(i + 3)];
  }
  if (parts.length < 2 || !parts[0].trim() || !parts[1].trim()) return {needFormat:true};
  return {q: parts[0].trim(), a: parts.slice(1).join(' | ').trim()};
}

/* ================= API ================= */
function apiReady(){ return !!(state.config.apiKey && state.config.baseUrl && state.config.model); }

function buildSystemPrompt(memories){
  let s = state.config.personality || DEFAULT_PERSONALITY;
  if (memories.length){
    s += '\n\nConhecimento que você já aprendeu com este usuário (use quando for relevante):\n' +
         memories.map(function(m, i){ return (i+1) + '. P: ' + m.q + '\n   R: ' + m.a; }).join('\n');
  }
  return s;
}

async function callAPI(history, memories){
  const url = state.config.baseUrl.replace(/\/+$/, '') + '/chat/completions';
  const msgs = [{role:'system', content: buildSystemPrompt(memories)}]
    .concat(history.slice(-20).map(function(m){ return {role:m.role, content:m.content}; }));
  const res = await fetch(url, {
    method:'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + state.config.apiKey},
    body: JSON.stringify({model: state.config.model, temperature: 0.7, messages: msgs})
  });
  if (!res.ok){
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) || JSON.stringify(j).slice(0,200); }
    catch(e){ detail = res.status + ' ' + res.statusText; }
    throw new Error(detail);
  }
  const data = await res.json();
  const out = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!out) throw new Error('Resposta vazia da API.');
  return out.trim();
}

/* ================= CHATS ================= */
function newChatObj(){
  return {id: uid(), title:'Novo chat', createdAt: now(), updatedAt: now(), messages: []};
}
function activeChat(){
  let c = state.chats.find(function(x){ return x.id === state.activeId; });
  if (!c){
    c = state.chats[0];
    if (!c){ c = newChatObj(); state.chats.push(c); persist(); }
    state.activeId = c.id;
  }
  return c;
}
function createChat(){
  const c = newChatObj();
  state.chats.unshift(c);
  state.activeId = c.id;
  persist();
  renderAll();
  const inp = $('#input'); if (inp) inp.focus();
}
function deleteChat(id){
  const c = state.chats.find(function(x){ return x.id === id; });
  if (!c) return;
  if (c.messages.length && !confirm('Excluir o chat "' + c.title + '"? Isso não volta.')) return;
  state.chats = state.chats.filter(function(x){ return x.id !== id; });
  if (state.activeId === id) state.activeId = state.chats[0] ? state.chats[0].id : null;
  persist(); renderAll();
}
function renameChat(id){
  const c = state.chats.find(function(x){ return x.id === id; });
  if (!c) return;
  const n = prompt('Novo nome do chat:', c.title);
  if (n === null) return;
  const t = n.trim();
  if (!t) return;
  c.title = t.slice(0, 60);
  persist(); renderAll();
}

function renderChatList(){
  const el = $('#chatList');
  if (!el) return;
  el.innerHTML = '';
  const ordered = state.chats.slice().sort(function(a,b){ return (b.updatedAt || 0) - (a.updatedAt || 0); });
  for (let i=0; i<ordered.length; i++){
    const c = ordered[i];
    const d = document.createElement('div');
    d.className = 'chat-item' + (c.id === state.activeId ? ' active' : '');
    d.innerHTML =
      '<span class="name">' + esc(c.title || 'Novo chat') + '</span>' +
      '<span class="acts">' +
        '<button class="mini" data-act="rename" title="Renomear">✏️</button>' +
        '<button class="mini" data-act="delete" title="Excluir">🗑</button>' +
      '</span>';
    (function(id){
      d.addEventListener('click', function(e){
        const act = e.target && e.target.dataset && e.target.dataset.act;
        if (act === 'rename'){ e.stopPropagation(); renameChat(id); return; }
        if (act === 'delete'){ e.stopPropagation(); deleteChat(id); return; }
        state.activeId = id; persist(); renderAll();
        closeSidebarMobile();
      });
    })(c.id);
    el.appendChild(d);
  }
}
