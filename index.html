<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha IA</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; max-width: 600px; margin: 20px auto; padding: 15px; }
  #status { background: #222; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; color: #0f0; }
  #chat { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; background: #181818; border-radius: 5px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 5px; }
  .eu { background: #0055ff; text-align: right; }
  .ia { background: #2a2a2a; }
  .box { display: flex; gap: 5px; }
  input { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; }
  button { padding: 10px 20px; background: #00cc66; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
  button:disabled { background: #444; color: #888; }
</style>
</head>
<body>

  <div id="status">Carregando IA...</div>
  <div id="chat"></div>
  <div class="box">
    <input type="text" id="texto" placeholder="Aguarde carregar..." disabled>
    <button id="enviar" disabled>Enviar</button>
  </div>

  <script type="module">
    import { pipeline } from 'https://unpkg.com';

    const status = document.getElementById('status');
    const chat = document.getElementById('chat');
    const input = document.getElementById('texto');
    const btn = document.getElementById('enviar');

    let memoria = JSON.parse(localStorage.getItem('memoria_ia')) || [];

    function add(txt, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = txt;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Carrega o modelo direto, sem frescura
    const ia = await pipeline('text2text-generation', 'Xenova/LaMini-Flan-T5-77M', {
      progress_callback: (p) => {
        if (p.status === 'progress') {
          status.textContent = `Baixando modelo: ${Math.round(p.progress)}%`;
        } else if (p.status === 'ready') {
          status.textContent = 'Pronta! Pode falar.';
          input.disabled = false;
          btn.disabled = false;
          input.placeholder = 'Digite algo...';
        }
      }
    });

    async function falar() {
      const msg = input.value.trim();
      if (!msg) return;

      input.value = '';
      input.disabled = true;
      btn.disabled = true;
      add(msg, 'eu');

      memoria.push(`Humano: ${msg}`);
      if (memoria.length > 10) memoria.shift();
      localStorage.setItem('memoria_ia', JSON.stringify(memoria));

      const prompt = `Responda em português.\n${memoria.join('\n')}\nIA:`;
      
      const res = await ia(prompt, { max_new_tokens: 60, temperature: 0.8 });
      const resposta = res[0].generated_text;

      add(resposta, 'ia');
      memoria.push(`IA: ${resposta}`);
      localStorage.setItem('memoria_ia', JSON.stringify(memoria));

      input.disabled = false;
      btn.disabled = false;
      input.focus();
    }

    btn.onclick = falar;
    input.onkeypress = (e) => { if (e.key === 'Enter') falar(); };
  </script>

</body>
</html>
